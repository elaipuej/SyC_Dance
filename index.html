<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clases de baile · SyC Dance Academy</title>
<style>
  :root {
    --fondo: #faf7f5;
    --superficie: #ffffff;
    --texto: #2b2330;
    --suave: #7a7185;
    --acento: #a100b8;
    --borde: #e7e0e5;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    line-height: 1.4;
  }

  header { padding: 1.25rem 1rem 1rem; text-align: center; }
  header img.logo { display: block; width: 100%; max-width: 280px; height: auto; margin: 0 auto .75rem; }
  header h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
  header p { margin: .3rem 0 0; color: var(--suave); font-size: .95rem; }

  /* Barra de filtros fija arriba al hacer scroll */
  .filtros {
    position: sticky;
    top: 0;
    z-index: 10;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .6rem;
    padding: .75rem 1rem;
    background: var(--fondo);
    border-bottom: 1px solid var(--borde);
  }
  .filtros label { display: block; font-size: .72rem; color: var(--suave); margin-bottom: .2rem; text-transform: uppercase; letter-spacing: .04em; }
  .filtros select {
    width: 100%;
    font: inherit;
    font-size: 16px; /* evita el zoom automático en iPhone */
    padding: .7rem 1.8rem .7rem .6rem;
    border: 1px solid var(--borde);
    border-radius: 10px;
    background: var(--superficie);
    color: var(--texto);
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--suave) 50%),
                      linear-gradient(135deg, var(--suave) 50%, transparent 50%);
    background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .filtros select:focus { outline: 2px solid var(--acento); outline-offset: 1px; }

  main { padding: 1rem; padding-bottom: 2.5rem; }
  .seccion { margin-bottom: 2rem; }
  .seccion h2 { font-size: 1.1rem; margin: 0 0 .75rem; display: flex; justify-content: space-between; align-items: baseline; }
  .seccion h2 span { font-size: .8rem; color: var(--suave); font-weight: normal; }

  /* Móvil: una columna; en pantallas grandes, varias columnas */
  .rejilla { display: grid; grid-template-columns: 1fr; gap: .9rem; }
  @media (min-width: 640px) {
    .rejilla { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    header h1 { font-size: 1.8rem; }
  }

  .tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: 14px; overflow: hidden; }
  /* Contenedor del video: formato vertical (shorts) para YouTube, horizontal para archivos locales */
  .medio { position: relative; background: #111; aspect-ratio: 9 / 16; max-height: 70vh; width: 100%; }
  .medio iframe, .medio video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .medio video { object-fit: contain; }
  .pendiente {
    aspect-ratio: 9 / 16; max-height: 70vh; width: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #f3eef1; color: var(--suave); font-size: .9rem;
  }
  .cuerpo { padding: .75rem .9rem .9rem; }
  .cuerpo h3 { margin: 0; font-size: 1.05rem; }
  .etiqueta { display: inline-block; font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: var(--acento); margin-bottom: .25rem; }
  .notas { margin: .3rem 0 0; color: var(--suave); font-size: .9rem; }

  .vacio { text-align: center; color: var(--suave); padding: 3rem 1rem; }
  footer { text-align: center; color: var(--suave); font-size: .8rem; padding: 0 1rem 2rem; }
</style>
</head>
<body>

<header>
  <img class="logo" src="log.jpeg" alt="SyC Dance Academy">
  <h1>Clases de baile</h1>
  <p>Figuras de salsa y bachata por nivel</p>
</header>

<div class="filtros">
  <div>
    <label for="filtro-estilo">Estilo</label>
    <select id="filtro-estilo"></select>
  </div>
  <div>
    <label for="filtro-clase">Nivel</label>
    <select id="filtro-clase"></select>
  </div>
</div>

<main id="contenido"></main>

<footer>SyC Dance Academy</footer>

<script>
/* ==========================================================
   📝 EDITA AQUÍ TUS CLASES
   - estilo: "Salsa" o "Bachata"
   - clase:  debe coincidir con un nivel de NIVELES de abajo
   - video:  enlace de YouTube (normal, shorts o youtu.be),
             o ruta a un archivo en el repo (ej. "bachata3/bachata3_clase1.mp4").
             Vacío = "Video pendiente".
   - notas:  opcional
   ========================================================== */
const FIGURAS = [
  // ---------- BACHATA 2 ----------
  { nombre: "Clase 1", estilo: "Bachata", clase: "Bachata 2", video: "https://youtube.com/shorts/GLrzsMZ1rMA", notas: "" },
  { nombre: "Clase 2", estilo: "Bachata", clase: "Bachata 2", video: "https://youtube.com/shorts/qboQi-EBb5c", notas: "" },
  { nombre: "Clase 3", estilo: "Bachata", clase: "Bachata 2", video: "https://youtube.com/shorts/bbWH3FQ3ucs", notas: "" },
  { nombre: "Clase 4", estilo: "Bachata", clase: "Bachata 2", video: "https://youtube.com/shorts/9WtfFcNz7GA", notas: "" },
  { nombre: "Clase 5", estilo: "Bachata", clase: "Bachata 2", video: "https://youtube.com/shorts/4B7djDy_hFQ", notas: "" },
  { nombre: "Clase 6", estilo: "Bachata", clase: "Bachata 2", video: "https://youtube.com/shorts/_6R2cqAEBZE", notas: "" },
  { nombre: "Clase 7", estilo: "Bachata", clase: "Bachata 2", video: "https://youtube.com/shorts/DWz1DCen-rQ", notas: "" },
  // ---------- BACHATA 3 ----------
  { nombre: "Clase 1", estilo: "Bachata", clase: "Bachata 3", video: "https://youtube.com/shorts/gwY61KUuBu0", notas: "" },
  { nombre: "Clase 2", estilo: "Bachata", clase: "Bachata 3", video: "https://youtube.com/shorts/8_PsNAS6Zo8", notas: "" },
  { nombre: "Clase 3", estilo: "Bachata", clase: "Bachata 3", video: "https://youtube.com/shorts/Kqq7Jp2_Ssk", notas: "" },
  { nombre: "Clase 4", estilo: "Bachata", clase: "Bachata 3", video: "https://youtube.com/shorts/dUx2xIbXbrc", notas: "" },
  { nombre: "Clase 5", estilo: "Bachata", clase: "Bachata 3", video: "https://youtube.com/shorts/2Hesb4yBREE", notas: "" },
  // ---------- LINEA 1 ----------
  { nombre: "Clase 1", estilo: "Salsa", clase: "Línea 1", video: "https://youtube.com/shorts/3KILgpCBQXA", notas: "" },
  { nombre: "Clase 2", estilo: "Salsa", clase: "Línea 1", video: "https://youtube.com/shorts/IUZNePNfW6Q", notas: "" },
  { nombre: "Clase 3", estilo: "Salsa", clase: "Línea 1", video: "https://youtube.com/shorts/EIVpOvw3boY", notas: "" },
  { nombre: "Clase 4", estilo: "Salsa", clase: "Línea 1", video: "https://youtube.com/shorts/bW6teS9yvBc", notas: "" },
  { nombre: "Clase 5", estilo: "Salsa", clase: "Línea 1", video: "https://youtube.com/shorts/quYE9IHH9uY", notas: "" },
  { nombre: "Clase 6", estilo: "Salsa", clase: "Línea 1", video: "https://youtube.com/shorts/8UNZZMKdNOE", notas: "" },


  // ---------- LINEA 2 ----------
  { nombre: "Clase 1", estilo: "Salsa", clase: "Línea 2", video: "https://youtube.com/shorts/8d36-Ik_Oyo", notas: "" },
  { nombre: "Clase 2", estilo: "Salsa", clase: "Línea 2", video: "https://youtube.com/shorts/GNy4LJAJ5mM", notas: "" },
  { nombre: "Clase 3", estilo: "Salsa", clase: "Línea 2", video: "https://youtube.com/shorts/9BCHB68y8r0", notas: "" },
  { nombre: "Clase 4", estilo: "Salsa", clase: "Línea 2", video: "https://youtube.com/shorts/5GJcVlblAKc", notas: "" },
  { nombre: "Clase 5", estilo: "Salsa", clase: "Línea 2", video: "https://youtube.com/shorts/LfJyHDCfK0M", notas: "" }
];

/* Niveles y a qué estilo pertenecen (define el segundo filtro) */
const NIVELES = [
  { nombre: "Línea 1",   estilo: "Salsa" },
  { nombre: "Línea 2",   estilo: "Salsa" },
  { nombre: "Cubana 2",  estilo: "Salsa" },
  { nombre: "Bachata 2", estilo: "Bachata" },
  { nombre: "Bachata 3", estilo: "Bachata" }
];
/* ========================================================== */

const ESTILOS = [...new Set(NIVELES.map(n => n.estilo))];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Extrae el código de un enlace de YouTube (watch?v=, youtu.be/, shorts/, embed/) */
function youtubeId(url) {
  const m = String(url).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

/* Segundo filtro: solo muestra los niveles del estilo elegido */
function actualizarNiveles() {
  const estilo = $("filtro-estilo").value;
  const niveles = NIVELES.filter(n => !estilo || n.estilo === estilo).map(n => n.nombre);
  const actual = $("filtro-clase").value;
  $("filtro-clase").innerHTML =
    `<option value="">Elige un nivel</option>` +
    niveles.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  if (niveles.includes(actual)) $("filtro-clase").value = actual;
}

function medio(video) {
  if (!video) return `<div class="pendiente">Video pendiente</div>`;
  const id = youtubeId(video);
  if (id) {
    /* loading="lazy": el video solo se carga cuando se acerca a la pantalla */
    return `<div class="medio"><iframe src="https://www.youtube.com/embed/${esc(id)}?playsinline=1&rel=0&enablejsapi=1"
              loading="lazy" onload="ytEscuchar(this)"
              allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen
              title="Video de clase"></iframe></div>`;
  }
  return `<div class="medio"><video controls preload="none" playsinline src="${esc(video)}"></video></div>`;
}

function tarjeta(f) {
  return `
    <article class="tarjeta">
      ${medio(f.video)}
      <div class="cuerpo">
        <span class="etiqueta">${esc(f.estilo)} · ${esc(f.clase)}</span>
        <h3>${esc(f.nombre)}</h3>
        ${f.notas ? `<p class="notas">${esc(f.notas)}</p>` : ""}
      </div>
    </article>`;
}

function render() {
  const estilo = $("filtro-estilo").value;
  const clase = $("filtro-clase").value;

  /* Sin nivel elegido no se muestra ningún video */
  if (!clase) {
    $("contenido").innerHTML = `<p class="vacio">Elige un nivel para ver las clases.</p>`;
    return;
  }

  const niveles = NIVELES
    .filter(n => !estilo || n.estilo === estilo)
    .filter(n => n.nombre === clase);

  const secciones = niveles
    .map(n => ({ nivel: n.nombre, figuras: FIGURAS.filter(f => f.clase === n.nombre) }))
    .filter(g => g.figuras.length);

  if (!secciones.length) {
    $("contenido").innerHTML = `<p class="vacio">Todavía no hay clases para este nivel.</p>`;
    return;
  }

  $("contenido").innerHTML = secciones.map(g => `
    <section class="seccion">
      <h2>${esc(g.nivel)} <span>${g.figuras.length} clase${g.figuras.length > 1 ? "s" : ""}</span></h2>
      <div class="rejilla">${g.figuras.map(tarjeta).join("")}</div>
    </section>`).join("");
}

/* Rellenar el primer filtro */
$("filtro-estilo").innerHTML =
  `<option value="">Todos los estilos</option>` +
  ESTILOS.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join("");

/* ---- Solo un video se reproduce a la vez ---- */

/* Pide a un iframe de YouTube que nos envíe su estado (reproduciendo, pausado...) */
function ytEscuchar(iframe) {
  iframe.contentWindow.postMessage(JSON.stringify({ event: "listening" }), "*");
}

/* Pausa todos los demás videos (YouTube y archivos locales) */
function pausarOtros(origen) {
  document.querySelectorAll("iframe").forEach(f => {
    if (f.contentWindow && f.contentWindow !== origen) {
      f.contentWindow.postMessage(JSON.stringify({ event: "command", func: "pauseVideo", args: [] }), "*");
    }
  });
  document.querySelectorAll("video").forEach(v => { if (v !== origen && !v.paused) v.pause(); });
}

/* YouTube avisa cuando un video cambia de estado: 1 = reproduciendo */
window.addEventListener("message", (e) => {
  if (!String(e.origin).includes("youtube.com")) return;
  let d;
  try { d = typeof e.data === "string" ? JSON.parse(e.data) : e.data; } catch { return; }
  if (d && d.event === "infoDelivery" && d.info && d.info.playerState === 1) {
    pausarOtros(e.source);
  }
});

/* Archivos locales: al dar play a uno, se pausan los demás */
document.addEventListener("play", (e) => {
  pausarOtros(e.target);
}, true);

$("filtro-estilo").addEventListener("change", () => { actualizarNiveles(); render(); });
$("filtro-clase").addEventListener("change", render);

actualizarNiveles();
render();
</script>
</body>
</html>
