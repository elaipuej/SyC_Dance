<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clases de baile</title>
<style>
  :root {
    --fondo: #faf7f5;
    --superficie: #ffffff;
    --texto: #2b2330;
    --suave: #7a7185;
    --acento: #c2185b;
    --borde: #ece6ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    line-height: 1.4;
  }
  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 1rem;
  }
  header h1 { margin: 0; font-size: 2.1rem; letter-spacing: -0.02em; }
  header p { margin: .35rem 0 0; color: var(--suave); }

  .controles {
    max-width: 1100px;
    margin: 1rem auto 0;
    padding: 0 1.25rem;
    display: grid;
    grid-template-columns: auto auto;
    justify-content: start;
    gap: .75rem;
  }
  .controles input,
  .controles select {
    font: inherit;
    padding: .7rem .9rem;
    border: 1px solid var(--borde);
    border-radius: 10px;
    background: var(--superficie);
    color: var(--texto);
  }
  .controles input:focus,
  .controles select:focus { outline: 2px solid var(--acento); outline-offset: 1px; }

  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  .seccion { margin-bottom: 2.5rem; }
  .seccion h2 {
    font-size: 1.2rem;
    margin: 0 0 .9rem;
    display: flex;
    align-items: center;
    gap: .6rem;
  }
  .seccion h2 span {
    font-size: .8rem;
    color: var(--suave);
    font-weight: normal;
  }

  .rejilla {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }
  .tarjeta {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .tarjeta video {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #111;
    object-fit: contain;
  }
  .pendiente {
    aspect-ratio: 16 / 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3eef1;
    color: var(--suave);
    font-size: .9rem;
  }
  .cuerpo { padding: .8rem .95rem 1rem; }
  .cuerpo h3 { margin: 0; font-size: 1.05rem; }
  .etiqueta {
    display: inline-block;
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--acento);
    margin-bottom: .3rem;
  }
  .notas { margin: .35rem 0 0; color: var(--suave); font-size: .9rem; }

  .vacio {
    text-align: center;
    color: var(--suave);
    padding: 3rem 1rem;
  }

  @media (max-width: 640px) {
    .controles { grid-template-columns: 1fr; }
    header h1 { font-size: 1.7rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Clases de baile</h1>
  <p>Figuras de salsa y bachata por nivel</p>
</header>

<div class="controles">
  <select id="filtro-estilo" aria-label="Filtrar por estilo"></select>
  <select id="filtro-clase" aria-label="Filtrar por clase"></select>
</div>

<main id="contenido"></main>

<script>
/* ==========================================================
   📝 EDITA AQUÍ TUS FIGURAS
   - estilo: "Salsa" o "Bachata"
   - clase:  "Línea 1", "Línea 2", "Cubana 2", "Bachata 2" o "Bachata 3"
   - video:  ruta al archivo (ej. "videos/bachata2/bachata2_clase1.mp4"),
             o un enlace de YouTube/Drive. Vacío = "Video pendiente".
   - notas:  opcional
   ========================================================== */
const FIGURAS = [
  { nombre: "Figura 1", estilo: "Bachata", clase: "Bachata 2", video: "videos/bachata2/bachata2_clase1.mp4", notas: "" },
  { nombre: "Figura 2", estilo: "Bachata", clase: "Bachata 2", video: "videos/bachata2/bachata2_clase2.mp4", notas: "" },
  { nombre: "Figura 3", estilo: "Bachata", clase: "Bachata 2", video: "videos/bachata2/bachata2_clase3.mp4", notas: "" },
  { nombre: "Figura 4", estilo: "Bachata", clase: "Bachata 2", video: "videos/bachata2/bachata2_clase4.mp4", notas: "" },
  { nombre: "Figura 5", estilo: "Bachata", clase: "Bachata 2", video: "videos/bachata2/bachata2_clase5.mp4", notas: "" }
];
/* ========================================================== */

const ORDEN_CLASES = ["Línea 1", "Línea 2", "Cubana 2", "Bachata 2", "Bachata 3"];
const ESTILOS = ["Salsa", "Bachata"];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function llenarSelect(id, todos, opciones) {
  $(id).innerHTML = `<option value="">${todos}</option>` +
    opciones.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("");
}

function tarjeta(f) {
  const media = f.video
    ? `<video controls preload="none" playsinline src="${esc(f.video)}"></video>`
    : `<div class="pendiente">Video pendiente</div>`;
  return `
    <article class="tarjeta">
      ${media}
      <div class="cuerpo">
        <span class="etiqueta">${esc(f.estilo)}</span>
        <h3>${esc(f.nombre)}</h3>
        ${f.notas ? `<p class="notas">${esc(f.notas)}</p>` : ""}
      </div>
    </article>`;
}

function render() {
  const estilo = $("filtro-estilo").value;
  const clase = $("filtro-clase").value;

  const filtradas = FIGURAS
    .filter(f => !estilo || f.estilo === estilo)
    .filter(f => !clase || f.clase === clase);

  if (!filtradas.length) {
    $("contenido").innerHTML = `<p class="vacio">No hay figuras con estos filtros.</p>`;
    return;
  }

  // Agrupar por clase, respetando el orden de niveles
  $("contenido").innerHTML = ORDEN_CLASES
    .map(c => ({ clase: c, figuras: filtradas.filter(f => f.clase === c) }))
    .filter(g => g.figuras.length)
    .map(g => `
      <section class="seccion">
        <h2>${esc(g.clase)} <span>${g.figuras.length} figura${g.figuras.length > 1 ? "s" : ""}</span></h2>
        <div class="rejilla">${g.figuras.map(tarjeta).join("")}</div>
      </section>`)
    .join("");
}

llenarSelect("filtro-estilo", "Todos los estilos", ESTILOS);
llenarSelect("filtro-clase", "Todas las clases", ORDEN_CLASES);
$("filtro-estilo").addEventListener("change", render);
$("filtro-clase").addEventListener("change", render);
render();
</script>
</body>
</html>
