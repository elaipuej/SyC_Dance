<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de figuras · Salsa y Bachata</title>
<style>
  :root { --bg:#0f0f14; --card:#1a1a24; --txt:#f2f2f7; --muted:#9a9ab0; --acc:#ff4d6d; --acc2:#ffb703; --line:#2a2a38; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:2.5rem 1rem 1.5rem; text-align:center; background:linear-gradient(135deg,#2a0a18,#0f0f14); }
  header h1 { margin:0; font-size:2rem; }
  header p { color:var(--muted); margin:.5rem 0 0; }
  .filtros { position:sticky; top:0; z-index:5; background:var(--bg); padding:1rem; border-bottom:1px solid var(--line);
             display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; justify-content:center; }
  .filtros input { flex:1 1 220px; max-width:360px; padding:.6rem .8rem; border-radius:8px; border:1px solid #333; background:var(--card); color:var(--txt); }
  .chip { padding:.45rem .9rem; border-radius:999px; border:1px solid #333; background:var(--card); color:var(--txt); cursor:pointer; font-size:.9rem; }
  .chip.activo { background:var(--acc); border-color:var(--acc); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem; padding:1rem; max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .media { background:#000; aspect-ratio:16/10; display:flex; align-items:center; justify-content:center; }
  video { width:100%; height:100%; object-fit:contain; }
  .pendiente { color:var(--muted); font-size:.9rem; }
  .info { padding:.8rem 1rem 1rem; }
  .info h3 { margin:.4rem 0 0; font-size:1.15rem; }
  .badge { display:inline-block; font-size:.75rem; padding:.15rem .5rem; border-radius:6px; background:var(--line); color:var(--acc2); margin-right:.3rem; }
  .notas { color:var(--muted); font-size:.9rem; margin:.4rem 0 0; }
  .vacio { grid-column:1/-1; text-align:center; color:var(--muted); padding:3rem; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:2rem 1rem; }
</style>
</head>
<body>

<header>
  <h1>Catálogo de figuras</h1>
  <p>Salsa y bachata · Línea 1, Línea 2, Cubana 2, Bachata 2 y Bachata 3</p>
</header>

<div class="filtros">
  <input id="buscar" type="search" placeholder="Buscar figura…" aria-label="Buscar figura">
  <div id="estilos"></div>
  <div id="clases"></div>
</div>

<main id="grid" class="grid"></main>

<footer>Hecho con ♥ para practicar en casa</footer>

<script>
/* ==========================================================
   📝 EDITA AQUÍ TUS FIGURAS
   - estilo: "Salsa" o "Bachata"
   - clase:  "Línea 1", "Línea 2", "Cubana 2", "Bachata 2" o "Bachata 3"
   - video:  ruta al archivo (ej. "videos/dile-que-no.mp4"),
             o un enlace de YouTube/Drive. Si lo dejas vacío,
             la tarjeta mostrará "Video pendiente".
   - notas:  opcional, pistas o cuentas de la figura
   ========================================================== */
const FIGURAS = [
  { nombre: "Dile que no", estilo: "Salsa",   clase: "Línea 1",  video: "videos/dile-que-no.mp4", notas: "Básica de cambio de peso, cuenta 5-6-7-8." },
  { nombre: "Enchufe",     estilo: "Salsa",   clase: "Línea 1",  video: "",                       notas: "Entrada con giro, mantén el frente." },
  { nombre: "Setenta",     estilo: "Salsa",   clase: "Línea 2",  video: "",                       notas: "Doble giro con cambio de manos." },
  { nombre: "Setenta",     estilo: "Salsa",   clase: "Cubana 2", video: "",                       notas: "Versión cubana, más cadera y menos pasos." },
  { nombre: "Sombrero",    estilo: "Bachata", clase: "Bachata 2", video: "",                      notas: "Giro sobre la cabeza de la pareja." },
  { nombre: "Cucaracha",   estilo: "Bachata", clase: "Bachata 3", video: "",                      notas: "Movimiento de pies en rebote." }
];
/* ========================================================== */

const ESTILOS = ["Todos", "Salsa", "Bachata"];
const CLASES  = ["Todas", "Línea 1", "Línea 2", "Cubana 2", "Bachata 2", "Bachata 3"];
const estado  = { estilo: "Todos", clase: "Todas", q: "" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function crearChips(contenedor, lista, clave) {
  const cont = $(contenedor);
  cont.innerHTML = lista.map(v =>
    `<button class="chip ${estado[clave] === v ? "activo" : ""}" data-v="${esc(v)}">${esc(v)}</button>`
  ).join("");
  cont.onclick = (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    estado[clave] = btn.dataset.v;
    crearChips(contenedor, lista, clave);
    render();
  };
}

function tarjeta(f) {
  const media = f.video
    ? `<video controls preload="none" playsinline src="${esc(f.video)}"></video>`
    : `<span class="pendiente">🎬 Video pendiente</span>`;
  return `
    <article class="card">
      <div class="media">${media}</div>
      <div class="info">
        <span class="badge">${esc(f.estilo)}</span><span class="badge">${esc(f.clase)}</span>
        <h3>${esc(f.nombre)}</h3>
        ${f.notas ? `<p class="notas">${esc(f.notas)}</p>` : ""}
      </div>
    </article>`;
}

function render() {
  const q = estado.q.trim().toLowerCase();
  const lista = FIGURAS
    .filter(f => estado.estilo === "Todos" || f.estilo === estado.estilo)
    .filter(f => estado.clase === "Todas" || f.clase === estado.clase)
    .filter(f => `${f.nombre} ${f.notas ?? ""}`.toLowerCase().includes(q));

  $("grid").innerHTML = lista.length
    ? lista.map(tarjeta).join("")
    : `<p class="vacio">No hay figuras con estos filtros.</p>`;
}

$("buscar").addEventListener("input", (e) => { estado.q = e.target.value; render(); });
crearChips("estilos", ESTILOS, "estilo");
crearChips("clases", CLASES, "clase");
render();
</script>
</body>
</html>
